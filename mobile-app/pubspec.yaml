name: lecto
description: Never miss a word. Every lecture, perfectly captured.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7

  # Dependency Injection
  get_it: ^8.0.3

  # Navigation
  go_router: ^15.1.2

  # Local Database
  sqflite: ^2.4.2
  path: ^1.9.1

  # Network
  dio: ^5.8.0+1
  connectivity_plus: ^6.1.4

  # Audio
  record: ^7.1.1
  just_audio: ^0.9.43

  # Storage
  path_provider: ^2.1.6
  flutter_secure_storage: ^9.2.4

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  shimmer: ^3.0.0
  lottie: ^3.3.1

  # PDF
  pdf: ^3.11.3
  printing: ^5.14.3

  # Utils
  intl: ^0.20.2
  uuid: ^4.5.1
  permission_handler: ^11.4.0
  image_picker: ^1.1.2
  http: ^1.6.0
  flutter_markdown: ^0.7.7+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assets/animations/
